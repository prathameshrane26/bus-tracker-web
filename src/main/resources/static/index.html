<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goa Transit - Live Bus Tracking</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #0b132b; color: #f8fafc; }
        
        body { display: flex; flex-direction: column; }

        header { 
            background: #1c2541; 
            padding: 10px 18px; 
            border-bottom: 2px solid #f59e0b; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            min-height: 60px; 
            flex-shrink: 0; 
        }
        header h1 { font-size: 1.2rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; font-weight: 800; white-space: nowrap; }
        header h1 span.subtext { font-size: 0.75rem; color: #f59e0b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .lang-btn { background: #0b132b; color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 10px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.78rem; transition: all 0.2s; }
        .lang-btn:hover { background: #38bdf8; color: #0b132b; }

        .driver-link { background: #0b132b; color: #34d399; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; border: 1px solid #10b981; transition: all 0.2s; }
        .driver-link:hover { background: #10b981; color: #0b132b; }

        .admin-link { background: #0b132b; color: #f59e0b; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; border: 1px solid #f59e0b; transition: all 0.2s; }
        .admin-link:hover { background: #f59e0b; color: #0b132b; }

        .app-layout { display: flex; flex: 1; width: 100%; height: calc(100vh - 60px); position: relative; overflow: hidden; }
        
        .sidebar { 
            width: 380px; 
            min-width: 380px; 
            background: #1c2541; 
            border-right: 1px solid #3a506b; 
            padding: 16px; 
            overflow-y: auto; 
            z-index: 900; 
            transition: transform 0.3s ease-in-out;
        }

        /* Mobile Responsive Layout Switch */
        @media (max-width: 768px) {
            header h1 span.subtext { display: none; }
            .header-actions { gap: 6px; }
            .lang-btn, .driver-link, .admin-link { padding: 5px 8px; font-size: 0.72rem; }
            
            .app-layout { flex-direction: column-reverse; }
            .sidebar { 
                width: 100%; 
                min-width: 100%; 
                height: 45vh; 
                border-right: none; 
                border-top: 2px solid #3a506b; 
                border-radius: 16px 16px 0 0;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            }
            .map-container { height: 55vh !important; }
        }
        
        .map-container { flex: 1; height: 100%; width: 100%; position: relative; background: #0b132b; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 10; }

        .filter-card { background: #0b132b; border: 1px solid #3a506b; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
        .filter-card h2 { font-size: 0.88rem; color: #f59e0b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
        select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #3a506b; background: #1c2541; color: #f8fafc; font-size: 0.82rem; outline: none; }
        select:focus { border-color: #f59e0b; }

        .next-bus-banner { background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%); border: 1px solid #38bdf8; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
        .next-bus-title { font-size: 0.7rem; text-transform: uppercase; color: #f59e0b; font-weight: 800; letter-spacing: 0.5px; }
        .next-bus-time { font-size: 1.3rem; font-weight: 800; color: #ffffff; margin: 2px 0; }
        .next-bus-sub { font-size: 0.75rem; color: #e0f2fe; }

        .bus-card { background: #0b132b; border: 1px solid #3a506b; border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .bus-card:hover { border-color: #f59e0b; transform: translateY(-1px); }

        .bus-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
        .bus-id { font-weight: 800; color: #f8fafc; font-size: 0.95rem; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; }
        .badge-shuttle { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .badge-local { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-live { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }

        .route-info { font-size: 0.82rem; color: #f8fafc; font-weight: 600; margin-bottom: 4px; }
        .stops-info { font-size: 0.72rem; color: #94a3b8; background: #1c2541; padding: 5px 8px; border-radius: 6px; margin-top: 4px; line-height: 1.3; }
        
        .timing-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #3a506b; }
        .eta-highlight { color: #34d399; font-weight: 800; background: rgba(52, 211, 153, 0.1); padding: 2px 6px; border-radius: 4px; }
        .no-results { text-align: center; color: #94a3b8; padding: 16px 10px; font-size: 0.85rem; }

        /* Custom Emoji Marker Styling */
        .moving-bus-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.8s linear;
        }
        .emoji-bus-pin {
            font-size: 32px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
            animation: pulse-glow 1.5s infinite alternate;
        }
        .emoji-static-pin {
            font-size: 26px;
            opacity: 0.85;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }
        .bus-label-tooltip {
            position: absolute;
            top: -24px;
            background: rgba(11, 19, 43, 0.95);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🚌 Goan Transit <span class="subtext">| kadamba tracker</span></h1>
        <div class="header-actions">
            <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">🌐 कोंकणी (Konkani)</button>
            <a href="driver.html" class="driver-link" id="driverLinkText">👨‍✈️ Driver Login</a>
            <a href="admin.html" class="admin-link" id="adminLinkText">⚙️ KTC Control</a>
        </div>
    </header>

    <div class="app-layout">
        <div class="sidebar">
            <div class="filter-card">
                <h2 id="searchTitle">🔍 Search Route</h2>
                
                <div class="form-group">
                    <label id="lblSource">Source Terminal</label>
                    <select id="sourceSelect" onchange="filterBuses()">
                        <option value="ALL" id="optAllSource">-- All Terminals (Soglle Station) --</option>
                        <option value="Panaji KTC Bus Stand">Panaji KTC Bus Stand</option>
                        <option value="Margao KTC Bus Terminal">Margao KTC Bus Terminal</option>
                        <option value="Calangute Beach Terminal">Calangute Beach Terminal</option>
                        <option value="Vasco da Gama Railway Station">Vasco da Gama Railway Station</option>
                        <option value="Mapusa Bus Stand">Mapusa Bus Stand</option>
                        <option value="Dabolim International Airport">Dabolim International Airport</option>
                        <option value="Manohar International Airport (Mopa)">Manohar International Airport (Mopa)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="lblDest">Destination Terminal</label>
                    <select id="destSelect" onchange="filterBuses()">
                        <option value="ALL" id="optAllDest">-- All Destinations --</option>
                        <option value="Margao KTC Bus Terminal">Margao KTC Bus Terminal</option>
                        <option value="Panaji KTC Bus Stand">Panaji KTC Bus Stand</option>
                        <option value="Calangute Beach Terminal">Calangute Beach Terminal</option>
                        <option value="Vasco da Gama Railway Station">Vasco da Gama Railway Station</option>
                        <option value="Mapusa Bus Stand">Mapusa Bus Stand</option>
                        <option value="Dabolim International Airport">Dabolim International Airport</option>
                        <option value="Manohar International Airport (Mopa)">Manohar International Airport (Mopa)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="lblType">Service Category</label>
                    <select id="typeSelect" onchange="filterBuses()">
                        <option value="ALL" id="optAllType">-- All Goan Services --</option>
                        <option value="SHUTTLE" id="optShuttle">Direct Express Shuttle (Point-to-Point)</option>
                        <option value="LOCAL" id="optLocal">Local Village & Intercity Bus (All Stops)</option>
                    </select>
                </div>
            </div>

            <div id="nextBusBanner" class="next-bus-banner" style="display: none;"></div>

            <h2 id="upcomingTitle" style="font-size: 0.8rem; color: #f59e0b; text-transform: uppercase; font-weight: 800; margin-bottom: 8px; letter-spacing: 0.5px;">Upcoming Buses</h2>
            <div id="busList">
                <div class="no-results">Fetching live schedules...</div>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        let currentLang = 'EN';

        const TRANSLATIONS = {
            EN: {
                driverText: "👨‍✈️ Driver Login",
                adminText: "⚙️ KTC Control",
                searchTitle: "🔍 Search Route (Sodh-Aso)",
                lblSource: "Source Terminal",
                lblDest: "Destination Terminal",
                lblType: "Service Category",
                optAllSource: "-- All Terminals --",
                optAllDest: "-- All Destinations --",
                optAllType: "-- All Goan Services --",
                optShuttle: "Direct Express Shuttle (Point-to-Point)",
                optLocal: "Local Village & Intercity Bus (All Stops)",
                upcomingTitle: "Upcoming Buses",
                nextTitle: "⚡ Next Approaching Bus",
                directLabel: "⚡ Direct Service:",
                stopsLabel: "📍 Stops:",
                arrivingNow: "ARRIVING NOW 🔔",
                mins: "mins",
                departed: "Departed",
                dep: "Dep:",
                noBus: "No buses available on this path."
            },
            KN: {
                driverText: "👨‍✈️ ड्रायव्हर लॉगिन",
                adminText: "⚙️ प्रशासक नियंत्रण",
                searchTitle: "🔍 रस्तो सोधा (मार्ग शोध)",
                lblSource: "सुरवातीचे बस स्थानक (Source)",
                lblDest: "निमाणे बस स्थानक (Destination)",
                lblType: "बस प्रकार (Category)",
                optAllSource: "-- सगळे स्थानक (All Stations) --",
                optAllDest: "-- सगळे निमाणे स्थानक --",
                optAllType: "-- सगळे बस प्रकार --",
                optShuttle: "शटल एक्स्प्रेस (Non-Stop Shuttle)",
                optLocal: "लोकल बस (सगळे थांबो / Local Bus)",
                upcomingTitle: "मुखाव्‍यल्या बसेस (Upcoming Buses)",
                nextTitle: "⚡ येवपी पहेली बस (Next Bus)",
                directLabel: "⚡ थेट सेवा (Non-Stop):",
                stopsLabel: "📍 थांबो (Stops):",
                arrivingNow: "आताच येता 🔔",
                mins: "मिनिटांनी",
                departed: "गेली (Departed)",
                dep: "भायर सरता:",
                noBus: "ह्या मार्गार एकूय बस उपलब्ध ना."
            }
        };

        const map = L.map('map', {
            center: [15.3982, 73.8113],
            zoom: 11
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const markers = {};
        const liveBusData = new Map();
        let allSchedules = [];
        let stompClient = null;

        const INTERMEDIATE_STOPS = {
            "Panaji KTC Bus Stand-Margao KTC Bus Terminal": ["Bambolim Cross", "Agassaim Circle", "Cortalim Junction", "Verna Industrial Estate"],
            "Margao KTC Bus Terminal-Panaji KTC Bus Stand": ["Verna Industrial Estate", "Cortalim Junction", "Agassaim Circle", "Bambolim Cross"],
            "Panaji KTC Bus Stand-Mapusa Bus Stand": ["Porvorim Mall De Goa", "Guirim Cross"],
            "Mapusa Bus Stand-Panaji KTC Bus Stand": ["Guirim Cross", "Porvorim Mall De Goa"],
            "Panaji KTC Bus Stand-Calangute Beach Terminal": ["Porvorim", "Sangolda", "Candolim Circle"],
            "Calangute Beach Terminal-Panaji KTC Bus Stand": ["Candolim Circle", "Sangolda", "Porvorim"]
        };

        function createEmojiIcon(busId, isLive, speed = 0) {
            const speedText = isLive ? `<div class="bus-label-tooltip">🚌 ${busId} (${Math.round(speed)} km/h)</div>` : `<div class="bus-label-tooltip" style="color:#94a3b8; border-color:#475569;">🏣 ${busId}</div>`;
            const emojiClass = isLive ? 'emoji-bus-pin' : 'emoji-static-pin';
            const emoji = isLive ? '🚌' : '🏣';

            return L.divIcon({
                className: 'moving-bus-marker',
                html: `${speedText}<span class="${emojiClass}">${emoji}</span>`,
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'EN' ? 'KN' : 'EN';
            document.getElementById('langBtn').innerText = currentLang === 'EN' ? '🌐 कोंकणी (Konkani)' : '🌐 English';
            
            const t = TRANSLATIONS[currentLang];
            document.getElementById('driverLinkText').innerText = t.driverText;
            document.getElementById('adminLinkText').innerText = t.adminText;
            document.getElementById('searchTitle').innerText = t.searchTitle;
            document.getElementById('lblSource').innerText = t.lblSource;
            document.getElementById('lblDest').innerText = t.lblDest;
            document.getElementById('lblType').innerText = t.lblType;
            document.getElementById('optAllSource').innerText = t.optAllSource;
            document.getElementById('optAllDest').innerText = t.optAllDest;
            document.getElementById('optAllType').innerText = t.optAllType;
            document.getElementById('optShuttle').innerText = t.optShuttle;
            document.getElementById('optLocal').innerText = t.optLocal;
            document.getElementById('upcomingTitle').innerText = t.upcomingTitle;

            filterBuses();
        }

        function calculateEta(departureTimeStr) {
            if (!departureTimeStr) return null;
            const now = new Date();
            const [hours, minutes] = departureTimeStr.split(':').map(Number);
            
            const depTime = new Date();
            depTime.setHours(hours, minutes, 0, 0);

            let diffMs = depTime - now;
            let diffMins = Math.round(diffMs / 60000);
            if (diffMins < -60) diffMins += (24 * 60);
            return diffMins;
        }

        function fetchSchedules() {
            fetch('/api/admin/schedules')
                .then(res => res.json())
                .then(data => { 
                    allSchedules = data; 
                    filterBuses(); 
                })
                .catch(err => console.error("Error loading schedules:", err));
        }

        function filterBuses() {
            const selectedSource = document.getElementById('sourceSelect').value;
            const selectedDest = document.getElementById('destSelect').value;
            const selectedType = document.getElementById('typeSelect').value;

            const filtered = allSchedules.filter(s => {
                const matchSource = (selectedSource === 'ALL' || s.startLocation === selectedSource);
                const matchDest = (selectedDest === 'ALL' || s.destinationLocation === selectedDest);
                const isShuttle = s.busType && s.busType.toLowerCase().includes('shuttle');
                let matchType = true;
                if (selectedType === 'SHUTTLE') matchType = isShuttle;
                if (selectedType === 'LOCAL') matchType = !isShuttle;
                return matchSource && matchDest && matchType;
            });

            filtered.sort((a, b) => {
                const etaA = calculateEta(a.departureTime);
                const etaB = calculateEta(b.departureTime);
                return (etaA > 0 ? etaA : 9999) - (etaB > 0 ? etaB : 9999);
            });

            updateNextBusBanner(filtered);
            renderBusList(filtered);
            updateMapMarkers(filtered);
        }

        function updateNextBusBanner(schedules) {
            const banner = document.getElementById('nextBusBanner');
            const nextBus = schedules.find(s => calculateEta(s.departureTime) >= 0);
            const t = TRANSLATIONS[currentLang];

            if (!nextBus) {
                banner.style.display = 'none';
                return;
            }

            const etaMins = calculateEta(nextBus.departureTime);
            let etaText = etaMins === 0 ? t.arrivingNow : `${etaMins} ${t.mins} (${nextBus.departureTime})`;

            banner.style.display = 'block';
            banner.innerHTML = `
                <div class="next-bus-title">${t.nextTitle}</div>
                <div class="next-bus-time">${etaText}</div>
                <div class="next-bus-sub"><strong>${nextBus.busId}</strong> &bull; ${nextBus.startLocation} &rarr; ${nextBus.destinationLocation}</div>
            `;
        }

        function renderBusList(schedules) {
            const container = document.getElementById('busList');
            const t = TRANSLATIONS[currentLang];

            if (!schedules || schedules.length === 0) {
                container.innerHTML = `<div class="no-results">${t.noBus}</div>`;
                return;
            }

            container.innerHTML = schedules.map(s => {
                const isShuttle = s.busType && s.busType.toLowerCase().includes('shuttle');
                const isLive = liveBusData.has(s.busId);
                const badgeClass = isLive ? 'badge-live' : (isShuttle ? 'badge-shuttle' : 'badge-local');
                const badgeLabel = isLive ? '● LIVE GPS' : (isShuttle ? (currentLang === 'KN' ? 'शटल एक्सप्रेस' : 'EXPRESS SHUTTLE') : (currentLang === 'KN' ? 'लोकल बस' : 'LOCAL BUS'));

                let routeStopsHtml = '';
                if (isShuttle) {
                    routeStopsHtml = `<div class="stops-info"><strong>${t.directLabel}</strong> ${s.startLocation} &rarr; ${s.destinationLocation}</div>`;
                } else {
                    const routeKey = `${s.startLocation}-${s.destinationLocation}`;
                    const stops = INTERMEDIATE_STOPS[routeKey] || ["Local Stops"];
                    routeStopsHtml = `<div class="stops-info"><strong>${t.stopsLabel}</strong> ${s.startLocation} &rarr; ${stops.join(' &rarr; ')} &rarr; ${s.destinationLocation}</div>`;
                }

                const etaMins = calculateEta(s.departureTime);
                let etaLabel = '';
                if (etaMins !== null) {
                    if (etaMins < 0) {
                        etaLabel = `<span style="color:#94a3b8;">${t.departed}</span>`;
                    } else if (etaMins === 0) {
                        etaLabel = `<span class="eta-highlight">${t.arrivingNow}</span>`;
                    } else {
                        etaLabel = `<span class="eta-highlight">${etaMins} ${t.mins}</span>`;
                    }
                }

                return `
                    <div class="bus-card" onclick="focusBus('${s.busId}')">
                        <div class="bus-header">
                            <span class="bus-id">🚌 ${s.busId}</span>
                            <span class="badge ${badgeClass}">${badgeLabel}</span>
                        </div>
                        <div class="route-info">${s.startLocation} &rarr; ${s.destinationLocation}</div>
                        ${routeStopsHtml}
                        <div class="timing-bar">
                            <span>🕒 ${t.dep} <strong>${s.departureTime}</strong></span>
                            ${etaLabel}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateMapMarkers(schedules) {
            const currentFilteredBusIds = new Set(schedules.map(s => s.busId));
            
            Object.keys(markers).forEach(busId => {
                if (!currentFilteredBusIds.has(busId)) {
                    map.removeLayer(markers[busId]);
                    delete markers[busId];
                }
            });

            schedules.forEach(s => {
                const liveInfo = liveBusData.get(s.busId);
                const isLive = !!liveInfo;
                const lat = isLive ? liveInfo.latitude : s.startLatitude;
                const lng = isLive ? liveInfo.longitude : s.startLongitude;
                const speed = isLive ? (liveInfo.speed || 0) : 0;

                if (lat && lng) {
                    const icon = createEmojiIcon(s.busId, isLive, speed);

                    if (!markers[s.busId]) {
                        markers[s.busId] = L.marker([lat, lng], { icon }).addTo(map);
                    } else {
                        markers[s.busId].setLatLng([lat, lng]);
                        markers[s.busId].setIcon(icon);
                    }

                    markers[s.busId].bindPopup(`
                        <div style="color: #0b132b; font-weight: 700;">
                            <h3 style="margin-bottom: 4px;">🚌 ${s.busId}</h3>
                            <p><strong>Route:</strong> ${s.startLocation} &rarr; ${s.destinationLocation}</p>
                            <p><strong>Status:</strong> ${isLive ? `Live (${Math.round(speed)} km/h)` : 'Scheduled Station Position'}</p>
                        </div>
                    `);
                }
            });
        }

        function focusBus(busId) {
            if (markers[busId]) {
                map.flyTo(markers[busId].getLatLng(), 14, { duration: 1.2 });
                markers[busId].openPopup();
            }
        }

        function initWebSocket() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, () => {
                stompClient.subscribe('/topic/schedule-added', () => fetchSchedules());
                stompClient.subscribe('/topic/schedule-deleted', (msg) => {
                    const data = JSON.parse(msg.body);
                    if (data.busId && markers[data.busId]) {
                        map.removeLayer(markers[data.busId]);
                        delete markers[data.busId];
                        liveBusData.delete(data.busId);
                    }
                    fetchSchedules();
                });

                stompClient.subscribe('/topic/active-buses', (msg) => {
                    const activeUpdates = JSON.parse(msg.body);
                    if (Array.isArray(activeUpdates)) {
                        activeUpdates.forEach(u => liveBusData.set(u.busId, u));
                        filterBuses();
                    }
                });
            }, (err) => {
                setTimeout(initWebSocket, 5000);
            });
        }

        window.onload = function() {
            setTimeout(() => {
                map.invalidateSize();
            }, 200);

            fetchSchedules();
            initWebSocket();
            setInterval(filterBuses, 60000);
        };
    </script>
</body>
</html>
